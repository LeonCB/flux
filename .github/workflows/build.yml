name: Build and test Windows package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test VirusTotal release scripts
        shell: pwsh
        run: ./scripts/test-virustotal.ps1
      - name: Test registered uninstaller handoff
        shell: pwsh
        run: ./scripts/test-uninstall-handoff.ps1
      - name: Set up Rust
        run: rustup default stable
      - name: Test desktop and renderer
        run: cargo test --locked --release -p flux -p flux-desktop
      - name: Build install package
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: |
            target/distribution/Flux-windows-x64.zip
            target/distribution/Flux-windows-x64.zip.sha256
